[project]
name = "constraintloop"
version = "0.3.0"
description = "Evidence-based completion gates for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mauhpr" }]
keywords = ["ai-agents", "coding-agents", "quality-gates", "hooks", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<4"]
anthropic = ["anthropic>=0.40,<1"]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/mauhpr/constraintloop"
Documentation = "https://github.com/mauhpr/constraintloop/tree/main/docs"
Repository = "https://github.com/mauhpr/constraintloop"
Issues = "https://github.com/mauhpr/constraintloop/issues"
Changelog = "https://github.com/mauhpr/constraintloop/blob/main/CHANGELOG.md"
Security = "https://github.com/mauhpr/constraintloop/security/policy"

[project.scripts]
constraintloop = "constraintloop.cli:main"
constraintloop-native-evaluator = "constraintloop.native_cli_evaluator:main"
constraintloop-codex-evaluator = "constraintloop.native_cli_evaluator:codex_main"
constraintloop-claude-evaluator = "constraintloop.native_cli_evaluator:claude_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constraintloop"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/schema",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/GOVERNANCE.md",
    "/RELEASE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["src/constraintloop"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["constraintloop"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "anthropic"
ignore_missing_imports = true
